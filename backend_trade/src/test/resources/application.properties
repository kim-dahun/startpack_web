spring.datasource.url=jdbc:h2:mem:backend_trade_test;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS trade_service\\;SET SCHEMA trade_service;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=trade_service
spring.sql.init.mode=always
server.port=9096
trade.gateway.gateway-id-header-name=X-Internal-Gateway-Id
trade.gateway.gateway-secret-header-name=X-Internal-Gateway-Secret
trade.gateway.allowed-gateways[0].gateway-id=backend_gateway
trade.gateway.allowed-gateways[0].shared-secret=test-secret
trade.gateway.allowed-gateways[1].gateway-id=backup_gateway
trade.gateway.allowed-gateways[1].shared-secret=backup-secret
trade.gateway.enforce=false
trade.kis.app-key=test-app-key
trade.kis.app-secret-key=test-app-secret
trade.kis.open-api-token-path=/oauth2/tokenP
trade.kis.token-scheduler.enabled=false
trade.kis.token-scheduler.initial-delay-ms=10000
trade.kis.token-scheduler.fixed-delay-ms=3600000
trade.kis.paper-base-url=http://localhost:19001
trade.kis.live-base-url=http://localhost:19002
trade.kis.paper-websocket-url=ws://localhost:19003
trade.kis.live-websocket-url=ws://localhost:19004
trade.kis.account-product-code=01
trade.kis.account-numbers=12345678-01
trade.kis.rest-client.enabled=false
trade.kis.realtime-client.enabled=false
trade.kis.websocket.approval-path=/oauth2/Approval
trade.master.scheduler.enabled=false
trade.master.scheduler.cron=0 0 7 * * MON-FRI
trade.master.scheduler.zone=Asia/Seoul
