spring.application.name=backend_trade
spring.config.import=optional:file:../param.env
server.port=${SERVER_PORT:9096}
spring.datasource.url=${TRADE_DB_URL:${DEFAULT_DB_URL:jdbc:postgresql://localhost:5432/postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DEFAULT_DB_ID:}
spring.datasource.password=${DEFAULT_DB_PASSWORD:}
spring.datasource.hikari.schema=${TRADE_DB_SCHEMA:trade_service}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${TRADE_DB_SCHEMA:trade_service}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.open-in-view=false
trade.gateway.gateway-id-header-name=${TRADE_GATEWAY_ID_HEADER_NAME:X-Internal-Gateway-Id}
trade.gateway.gateway-secret-header-name=${TRADE_GATEWAY_SECRET_HEADER_NAME:X-Internal-Gateway-Secret}
trade.gateway.allowed-gateways[0].gateway-id=${AUTH_ALLOWED_GATEWAY_ID_0:backend_gateway}
trade.gateway.allowed-gateways[0].shared-secret=${AUTH_ALLOWED_GATEWAY_SECRET_0:local-dev-gateway-secret}
trade.gateway.enforce=${TRADE_GATEWAY_ENFORCE:true}
trade.kis.app-key=${APP_KEY:}
trade.kis.app-secret-key=${APP_SECRET_KEY:}
trade.kis.open-api-token-path=/oauth2/tokenP
trade.kis.token-scheduler.enabled=${KIS_TOKEN_SCHEDULER_ENABLED:true}
trade.kis.token-scheduler.initial-delay-ms=${KIS_TOKEN_SCHEDULER_INITIAL_DELAY_MS:10000}
trade.kis.token-scheduler.fixed-delay-ms=${KIS_TOKEN_SCHEDULER_FIXED_DELAY_MS:3600000}
trade.kis.paper-base-url=https://openapivts.koreainvestment.com:29443
trade.kis.live-base-url=https://openapi.koreainvestment.com:9443
trade.kis.paper-websocket-url=ws://ops.koreainvestment.com:31000
trade.kis.live-websocket-url=ws://ops.koreainvestment.com:21000
trade.kis.account-product-code=${KIS_ACCOUNT_PRODUCT_CODE:${ACNT_PRDT_CD:01}}
trade.kis.account-numbers=${KIS_ACCOUNT_NUMBERS:${KIS_ACCOUNT_NO:${KIS_ACCOUNT_NUMBER:${KIS_CANO:${CANO:${ACCOUNT_NO:}}}}}}
trade.kis.rest-client.enabled=true
trade.kis.realtime-client.enabled=false
trade.kis.websocket.approval-path=/oauth2/Approval
trade.master.scheduler.enabled=${TRADE_MASTER_SCHEDULER_ENABLED:true}
trade.master.scheduler.cron=${TRADE_MASTER_SCHEDULER_CRON:0 0 7 * * MON-FRI}
trade.master.scheduler.zone=${TRADE_MASTER_SCHEDULER_ZONE:Asia/Seoul}
