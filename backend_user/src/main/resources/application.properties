spring.application.name=backend_user
server.port=${USER_SERVER_PORT:9093}
spring.config.import=optional:file:../param.env,optional:file:./param.env
spring.datasource.url=${USER_DB_URL:${DEFAULT_DB_URL:jdbc:postgresql://localhost:5432/postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${USER_DB_ID:${DEFAULT_DB_ID:postgres}}
spring.datasource.password=${USER_DB_PASSWORD:${DEFAULT_DB_PASSWORD:admin1!}}
spring.datasource.hikari.initialization-fail-timeout=${USER_DB_INITIALIZATION_FAIL_TIMEOUT:-1}
spring.datasource.hikari.schema=${USER_DB_SCHEMA:user_service}
spring.jpa.hibernate.ddl-auto=${USER_JPA_DDL_AUTO:${JPA_DDL_AUTO:update}}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${USER_DB_SCHEMA:user_service}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.open-in-view=false
gateway.client.base-url=${GATEWAY_BASE_URL:http://localhost:9091}
gateway.client.auth-login-path=${GATEWAY_AUTH_LOGIN_PATH:/api/auth/login}
gateway.client.internal-gateway-id=${GATEWAY_INTERNAL_GATEWAY_ID:backend_gateway}
gateway.client.internal-gateway-secret=${GATEWAY_INTERNAL_GATEWAY_SECRET:local-dev-gateway-secret}
user.gateway-access.enabled=${USER_GATEWAY_ACCESS_ENABLED:true}
user.gateway-access.gateway-id-header-name=${USER_GATEWAY_ID_HEADER_NAME:X-Internal-Gateway-Id}
user.gateway-access.gateway-secret-header-name=${USER_GATEWAY_SECRET_HEADER_NAME:X-Internal-Gateway-Secret}
user.gateway-access.allowed-gateways=${USER_ALLOWED_GATEWAYS:backend_gateway:local-dev-gateway-secret}
logging.level.com.upmudoum.user=${USER_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${USER_JPA_SQL_LOG_LEVEL:DEBUG}
logging.level.org.hibernate.orm.jdbc.bind=${USER_JPA_BIND_LOG_LEVEL:TRACE}
