server.port=${SERVER_PORT:9091}
spring.application.name=backend_gateway
spring.config.import=optional:file:../param.env,optional:file:./param.env

spring.datasource.url=${DEFAULT_DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=gateway_service}
spring.datasource.username=${DEFAULT_DB_ID:}
spring.datasource.password=${DEFAULT_DB_PASSWORD:}
spring.datasource.hikari.schema=${GATEWAY_DB_SCHEMA:gateway_service}
spring.jpa.properties.hibernate.default_schema=${GATEWAY_DB_SCHEMA:gateway_service}
spring.jpa.hibernate.ddl-auto=none

# Gateway is the single external entrypoint. Downstream backend URLs are internal targets only.
gateway.routes.services.auth-url=${GATEWAY_ROUTE_AUTH_URL:http://localhost:9092}
gateway.routes.services.user-url=${GATEWAY_ROUTE_USER_URL:http://localhost:9093}
gateway.routes.services.erp-url=${GATEWAY_ROUTE_ERP_URL:http://localhost:9094}
gateway.routes.services.groupware-url=${GATEWAY_ROUTE_GROUPWARE_URL:http://localhost:9095}
gateway.routes.services.trade-url=${GATEWAY_ROUTE_TRADE_URL:http://localhost:9096}
gateway.auth.verify-path=${GATEWAY_AUTH_VERIFY_PATH:/api/v1/auth/tokens/verify}
gateway.auth.refresh-path=${GATEWAY_AUTH_REFRESH_PATH:/api/auth/tokens/refresh}
gateway.auth.timeout=${GATEWAY_AUTH_TIMEOUT:3s}
gateway.auth.access-token-cookie-name=${GATEWAY_AUTH_ACCESS_TOKEN_COOKIE_NAME:ACCESS_TOKEN}
gateway.auth.refresh-token-cookie-name=${GATEWAY_AUTH_REFRESH_TOKEN_COOKIE_NAME:REFRESH_TOKEN}
gateway.auth.cache.enabled=${GATEWAY_AUTH_CACHE_ENABLED:true}
gateway.auth.cache.ttl=${GATEWAY_AUTH_CACHE_TTL:5s}
gateway.auth.cache.max-size=${GATEWAY_AUTH_CACHE_MAX_SIZE:1000}
gateway.auth.circuit-breaker.name=${GATEWAY_AUTH_CIRCUIT_BREAKER_NAME:authVerification}
gateway.auth.circuit-breaker.failure-rate-threshold=${GATEWAY_AUTH_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:50}
gateway.auth.circuit-breaker.sliding-window-size=${GATEWAY_AUTH_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE:20}
gateway.auth.circuit-breaker.permitted-number-of-calls-in-half-open-state=${GATEWAY_AUTH_CIRCUIT_BREAKER_HALF_OPEN_CALLS:5}
gateway.auth.circuit-breaker.wait-duration-in-open-state=${GATEWAY_AUTH_CIRCUIT_BREAKER_OPEN_WAIT:10s}
gateway.cors.allowed-origins=${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5176,http://localhost:5177,http://localhost:5178}
gateway.cors.allowed-methods=${GATEWAY_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
gateway.cors.allowed-headers=${GATEWAY_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Requested-With,X-Request-Id,X-Open-Api-Token,X-User-Id,X-Com-Cd,X-Roles,X-Token-Type}
gateway.cors.allow-credentials=${GATEWAY_CORS_ALLOW_CREDENTIALS:true}
gateway.cors.max-age=${GATEWAY_CORS_MAX_AGE:1h}
gateway.internal.gateway-id=${GATEWAY_INTERNAL_GATEWAY_ID:backend_gateway}
gateway.internal.gateway-secret=${GATEWAY_INTERNAL_GATEWAY_SECRET:local-dev-gateway-secret}
gateway.websocket.trade-realtime-path=${GATEWAY_WS_TRADE_REALTIME_PATH:/ws/trade/realtime}
gateway.websocket.trade-realtime-backend-path=${GATEWAY_WS_TRADE_REALTIME_BACKEND_PATH:/ws/trade/realtime}
gateway.websocket.connect-timeout=${GATEWAY_WS_CONNECT_TIMEOUT:3s}
gateway.websocket.forward-browser-cookies=${GATEWAY_WS_FORWARD_BROWSER_COOKIES:false}
gateway.logging.request-response-enabled=${GATEWAY_REQUEST_RESPONSE_LOGGING_ENABLED:true}
gateway.logging.slow-request-threshold-millis=${GATEWAY_SLOW_REQUEST_THRESHOLD_MILLIS:1000}
# Optional authorization rules. Example:
# gateway.authorization.rules[0].path-pattern=/api/admin/**
# gateway.authorization.rules[0].required-roles[0]=ROLE_ADMIN

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true

gateway.routes.public-paths[0]=/actuator/health
gateway.routes.public-paths[1]=/actuator/health/**
gateway.routes.public-paths[2]=/api/users/login
gateway.routes.public-paths[3]=/api/users/signup
gateway.routes.public-paths[4]=/api/auth/tokens/refresh
gateway.routes.public-paths[5]=/api/auth/tokens/logout
gateway.routes.public-paths[6]=/api/v1/auth/tokens/refresh
gateway.routes.public-paths[7]=/api/v1/auth/tokens/logout
gateway.routes.public-paths[8]=/api/auth/open-api/token
gateway.routes.public-paths[9]=/api/v1/auth/open-api/token
gateway.routes.public-paths[10]=/docs/**

gateway.routes.internal-paths[0]=/api/auth/login

gateway.routes.open-api-paths[0]=/open-api/**
