spring.application.name=erp
server.port=${SERVER_PORT:9094}
spring.config.import=optional:file:../param.env,optional:file:./param.env
spring.datasource.url=${ERP_DB_URL:${DEFAULT_DB_URL:jdbc:postgresql://localhost:5432/postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${ERP_DB_ID:${DEFAULT_DB_ID:}}
spring.datasource.password=${ERP_DB_PASSWORD:${DEFAULT_DB_PASSWORD:}}
spring.datasource.hikari.schema=${ERP_DB_SCHEMA:erp_service}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${ERP_DB_SCHEMA:erp_service}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.batch.job.enabled=${ERP_BATCH_JOB_ENABLED:false}
erp.gateway.only=${ERP_GATEWAY_ONLY:true}
erp.gateway.allowed-credentials=${ERP_GATEWAY_ALLOWED_CREDENTIALS:backend_gateway:local-dev-gateway-secret}
