spring.application.name=backend_auth
spring.config.import=optional:file:../param.env,optional:file:./param.env
server.port=${SERVER_PORT:9092}

spring.datasource.url=${AUTH_DB_URL:${DEFAULT_DB_URL:jdbc:postgresql://localhost:5432/postgres}}
spring.datasource.username=${AUTH_DB_ID:${DEFAULT_DB_ID:}}
spring.datasource.password=${AUTH_DB_PASSWORD:${DEFAULT_DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.schema=${AUTH_DB_SCHEMA:auth_service}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${AUTH_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${AUTH_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${AUTH_DB_SCHEMA:auth_service}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.sql.init.mode=never

auth.jwt.issuer=${AUTH_JWT_ISSUER:backend-auth}
auth.jwt.clock-skew=PT30S
auth.jwt.access.audience=${AUTH_JWT_ACCESS_AUDIENCE:backend-user}
auth.jwt.access.secret=${AUTH_JWT_ACCESS_SECRET:change-me-access-secret-key-1234567890}
auth.jwt.access.ttl=PT15M
auth.jwt.refresh.audience=${AUTH_JWT_REFRESH_AUDIENCE:backend-user}
auth.jwt.refresh.secret=${AUTH_JWT_REFRESH_SECRET:change-me-refresh-secret-key-1234567890}
auth.jwt.refresh.ttl=P14D
auth.jwt.open-api.audience=${AUTH_JWT_OPEN_API_AUDIENCE:backend-gateway}
auth.jwt.open-api.secret=${AUTH_JWT_OPEN_API_SECRET:change-me-open-api-secret-key-1234567890}
auth.jwt.open-api.ttl=PT10M

auth.cookie.access-token-name=${AUTH_COOKIE_ACCESS_TOKEN_NAME:ACCESS_TOKEN}
auth.cookie.refresh-token-name=${AUTH_COOKIE_REFRESH_TOKEN_NAME:REFRESH_TOKEN}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
auth.cookie.path=${AUTH_COOKIE_PATH:/}

auth.gateway.enforce=${AUTH_GATEWAY_ENFORCE:true}
auth.gateway.gateway-id-header-name=${AUTH_GATEWAY_ID_HEADER_NAME:X-Internal-Gateway-Id}
auth.gateway.gateway-secret-header-name=${AUTH_GATEWAY_SECRET_HEADER_NAME:X-Internal-Gateway-Secret}
auth.gateway.allowed-gateways[0].gateway-id=${AUTH_ALLOWED_GATEWAY_ID_0:backend_gateway}
auth.gateway.allowed-gateways[0].shared-secret=${AUTH_ALLOWED_GATEWAY_SECRET_0:local-dev-gateway-secret}

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.upmudoum.auth.common.web.ApiAccessLogFilter=INFO
