spring.datasource.url=jdbc:h2:mem:backend_auth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS auth_service\\;SET SCHEMA auth_service
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.schema=auth_service
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=auth_service
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
auth.jwt.issuer=backend-auth
auth.jwt.clock-skew=PT30S
auth.jwt.access.audience=backend-user
auth.jwt.access.secret=change-me-access-secret-key-1234567890
auth.jwt.access.ttl=PT15M
auth.jwt.refresh.audience=backend-user
auth.jwt.refresh.secret=change-me-refresh-secret-key-1234567890
auth.jwt.refresh.ttl=P14D
auth.jwt.open-api.audience=backend-gateway
auth.jwt.open-api.secret=change-me-open-api-secret-key-1234567890
auth.jwt.open-api.ttl=PT10M
auth.cookie.access-token-name=ACCESS_TOKEN
auth.cookie.refresh-token-name=REFRESH_TOKEN
auth.cookie.secure=false
auth.cookie.same-site=Lax
auth.cookie.path=/
auth.gateway.enforce=true
auth.gateway.gateway-id-header-name=X-Internal-Gateway-Id
auth.gateway.gateway-secret-header-name=X-Internal-Gateway-Secret
auth.gateway.allowed-gateways[0].gateway-id=backend_gateway
auth.gateway.allowed-gateways[0].shared-secret=test-gateway-secret
