spring.application.name=backend_groupware
server.port=${SERVER_PORT:9095}
spring.config.import=optional:file:../param.env,optional:file:./param.env
spring.datasource.url=${GROUPWARE_DB_URL:${DEFAULT_DB_URL:jdbc:postgresql://localhost:5432/postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${GROUPWARE_DB_ID:${DEFAULT_DB_ID:}}
spring.datasource.password=${GROUPWARE_DB_PASSWORD:${DEFAULT_DB_PASSWORD:}}
spring.datasource.hikari.schema=${GROUPWARE_DB_SCHEMA:groupware_service}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${GROUPWARE_DB_SCHEMA:groupware_service}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
groupware.gateway-only.enabled=${GROUPWARE_GATEWAY_ONLY_ENABLED:true}
groupware.gateway-only.allowed-gateways=${GROUPWARE_ALLOWED_GATEWAYS:backend_gateway:local-dev-gateway-secret}
groupware.gateway-only.allowed-gateway-ids=${GROUPWARE_ALLOWED_GATEWAY_IDS:backend_gateway}
groupware.gateway-only.shared-secret=${GROUPWARE_GATEWAY_SHARED_SECRET:local-dev-gateway-secret}
groupware.gateway-client.gateway-id=${GROUPWARE_GATEWAY_CLIENT_ID:backend_gateway}
groupware.gateway-client.gateway-secret=${GROUPWARE_GATEWAY_CLIENT_SECRET:local-dev-gateway-secret}
groupware.user-directory.enabled=${GROUPWARE_USER_DIRECTORY_ENABLED:true}
groupware.user-directory.base-url=${GROUPWARE_USER_DIRECTORY_BASE_URL:http://localhost:9091}
groupware.user-directory.organization-users-path=${GROUPWARE_USER_DIRECTORY_ORG_USERS_PATH:/api/organization/users}
